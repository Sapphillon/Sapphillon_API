syntax = "proto3";

package sapphillon.arcana.v1;

// ============================================================
// PackageConfig — PackageToml / マニフェスト共通
// ============================================================

// パッケージの共通設定。PackageToml とプラグインマニフェストの双方で参照される。
message PackageConfig {
  // パッケージの一意識別子。
  string id = 1;
  // パッケージ名。
  string name = 2;
  // パッケージのバージョン文字列。
  string version = 3;
  // パッケージの説明。
  string description = 4;
  // 代表者1名の GitHub username。
  string author_github_id = 5; // 単数（代表者1名・username）
  // パッケージを分類するためのタグ一覧。
  repeated string tags = 6;
  // パッケージのホームページ URL（省略可）。
  optional string homepage_url = 7;
  // 所有権検証用の GitHub numeric user id。
  optional string github_numeric_id = 8; // immutable numeric user id (所有権検証用)
}

// package.toml ファイルのルート構造。
message PackageToml {
  // パッケージ設定本体。
  PackageConfig package = 1;
  // このパッケージが対象とする Arcana API のバージョン。
  string api_version = 2;
}
